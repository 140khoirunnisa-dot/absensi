<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Absensi</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h2{
    text-align:center;
}

input,select,button{
    padding:10px;
    margin:5px;
}

button{
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table,th,td{
    border:1px solid #ddd;
}

th,td{
    padding:10px;
    text-align:center;
}

th{
    background:#007bff;
    color:white;
}
</style>

</head>
<body>

<div class="container">

<h2>📋 Aplikasi Absensi</h2>

<input type="text" id="nama" placeholder="Masukkan Nama">

<select id="status">
<option>Hadir</option>
<option>Izin</option>
<option>Sakit</option>
<option>Alpha</option>
</select>

<button onclick="tambahData()">Tambah</button>

<table>

<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Status</th>
<th>Tanggal</th>
</tr>
</thead>

<tbody id="dataAbsen">

</tbody>

</table>

</div>

<script>

let nomor=1;

function tambahData(){

let nama=document.getElementById("nama").value;

let status=document.getElementById("status").value;

if(nama==""){
alert("Nama belum diisi");
return;
}

let tanggal=new Date().toLocaleDateString('id-ID');

let tabel=document.getElementById("dataAbsen");

let baris=tabel.insertRow();

baris.insertCell(0).innerHTML=nomor++;
baris.insertCell(1).innerHTML=nama;
baris.insertCell(2).innerHTML=status;
baris.insertCell(3).innerHTML=tanggal;

document.getElementById("nama").value="";

}

</script>

</body>
</html>
